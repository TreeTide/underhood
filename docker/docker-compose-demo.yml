version: "3.3"

services:
  bake-demo-index:
    image: ghcr.io/treetide/underhood-bake-demo-index:local
    build:
      context: demo-index
      dockerfile: Dockerfile
    volumes:
      - "demoindex:/out"

  zoekt-underhood:
    image: ghcr.io/treetide/zoekt-underhood:local
    build:
      context: ../zoekt-underhood
      dockerfile: Dockerfile
    restart: always
    expose:
      - "6080"
    volumes:
      - "demoindex:/index:ro"
    command: [ "-index", "/index" ]

  nginx:
    image: ghcr.io/treetide/underhood-nginx-dev:local
    build:
      context: ..
      dockerfile: docker/underhood-nginx/Dockerfile
    restart: always
    ports:
      - "8082:80"

volumes:
  demoindex: {}
