version: "3.3"

name: zuh

services:
  zoekt-underhood:
    image: ghcr.io/treetide/zoekt-underhood:local
    build:
      context: ../zoekt-underhood
      dockerfile: Dockerfile
    restart: always
    expose:
      - "6080"
    volumes:
      - "$ZOEKT_INDEX_DIR:/index:ro"
    command: [ "-index", "/index" ]

  nginx:
    image: ghcr.io/treetide/underhood-nginx-dev:local
    build:
      context: ..
      dockerfile: docker/underhood-nginx/Dockerfile
    environment:
      ZOEKT_UNDERHOOD_HOST: zoekt-underhood
    restart: always
    ports:
      - "8082:6090"
